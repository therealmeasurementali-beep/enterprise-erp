services:
  backend:
    image: backend:latest
    ports:
      - "8000:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: postgresql://postgres:aliali@db:5432/fundsroom_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: fundsroom-frontend:1.0
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aliali
      POSTGRES_DB: fundsroom_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fundsroom_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:

