apiVersion: v1
kind: Service

metadata:
  name: {{ include "enterprise-erp.fullname" . }}-frontend

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    app: enterprise-erp-frontend

  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
