{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "enterprise-erp.fullname" . }}-ingress

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:

          - path: /
            pathType: Prefix

            backend:
              service:
                name: {{ include "enterprise-erp.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}

          - path: /api
            pathType: Prefix

            backend:
              service:
                name: {{ include "enterprise-erp.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}

{{- end }}