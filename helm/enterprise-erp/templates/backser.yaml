apiVersion: v1
kind: Service

metadata:
  name: {{ include "enterprise-erp.fullname" . }}-backend

spec:
  type: {{ .Values.backend.service.type }}

  selector:
    app: enterprise-erp-backend

  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP